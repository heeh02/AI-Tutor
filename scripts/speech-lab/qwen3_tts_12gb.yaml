# Based on vllm-omni v0.32.0 qwen3_tts.yaml. One foreground request on RTX 5070.
# Memory settings are a starting allocation, not a measured peak guarantee.
# The 256 MiB Talker KV pool supports one 2048-token context; it is not a
# whole-process VRAM cap. This allocation passed the controlled Qwen ASR/TTS cohort.
model_runner: v2
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      talker_first_audio: true
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_left_context_frames: 72
      initial_codec_chunk_frames: 1
      decode_batch_max_size: 1
stages:
  - stage_id: 0
    max_num_seqs: 1
    kv_cache_memory_bytes: 268435456
    enforce_eager: false
    gpu_memory_utilization: 0.35
    trust_remote_code: false
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 512
    max_model_len: 2048
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.9
      top_k: 50
      max_tokens: 2048
      min_tokens: 2
      repetition_penalty: 1.05
    silence_ban_frames: 0
    subtalker_sampling_params:
      do_sample: true
      temperature: 0.9
      top_k: 50
      top_p: 1.0
  - stage_id: 1
    dtype: bfloat16
    max_num_seqs: 1
    gpu_memory_utilization: 0.15
    enforce_eager: false
    trust_remote_code: false
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 65536
    max_model_len: 65536
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      repetition_penalty: 1.0
