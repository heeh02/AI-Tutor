# Standalone CosyVoice3 candidate, based on vllm-omni v0.32.0.
# Do not start alongside the resident Qwen service on the 12 GB GPU.
# The reservations below are not a measured total VRAM guarantee.
pipeline: cosyvoice3
async_chunk: true
connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 8
      codec_left_context_frames: 25
      codec_vocab_size: 6561
stages:
  - stage_id: 0
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.30
    # One 4096-token request needs about 48 MiB on the measured architecture.
    # The prior ratio allocated 2.39 GiB / 209056 tokens despite max_num_seqs=1.
    kv_cache_memory_bytes: 134217728
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      max_tokens: 2048
      top_k: 25
      top_p: 0.8
      repetition_penalty: 1.0001
    disable_hybrid_kv_cache_manager: true
    mm_processor_cache_gb: 0
    skip_mm_profiling: true
  - stage_id: 1
    max_num_batched_tokens: 4096
    max_num_seqs: 1
    gpu_memory_utilization: 0.20
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    max_model_len: 4096
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      max_tokens: 2048
    disable_hybrid_kv_cache_manager: true
    skip_mm_profiling: true
