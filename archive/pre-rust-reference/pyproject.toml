[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor-local"
version = "0.1.0"
description = "Local functional-block STEM tutoring workstation"
requires-python = ">=3.10"
dependencies = ["fastapi==0.115.12", "uvicorn==0.34.2", "websockets==15.0.1", "jsonschema==4.23.0", "sounddevice==0.5.1", "scipy==1.15.3", "faster-whisper==1.2.1", "psutil==7.0.0", "tomli==2.2.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

