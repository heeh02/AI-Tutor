[package]
name = "tutor-ui"
version = "0.2.0"
edition = "2021"
description = "AI Tutor local workbench written in Rust and compiled to WebAssembly"
publish = false

[dependencies]
yew = { version = "=0.21.0", features = ["csr"] }
serde_json = "1.0"
gloo-net = { version = "=0.6.0", features = ["http", "json"] }
gloo-timers = "=0.3.0"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
web-sys = { version = "=0.3.77", features = ["Window", "Document", "Element", "DomRect", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "HtmlSelectElement", "HtmlAudioElement", "PointerEvent", "KeyboardEvent", "InputEvent", "RequestCredentials", "RequestCache", "AbortController", "AbortSignal", "EventTarget", "FocusEvent", "FocusOptions", "WebSocket", "BinaryType", "MessageEvent", "CloseEvent", "ErrorEvent", "Blob", "BlobPropertyBag", "Url", "Location", "HtmlImageElement", "Event", "VisibilityState", "Performance"] }

